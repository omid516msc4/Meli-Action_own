name: دانلودر هوشمند یوتیوب (نسخه اصلاح شده)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "📺 لینک ویدیو یوتیوب"
        required: true
        type: string
      output_format:
        description: "🎧 فرمت خروجی"
        required: true
        type: choice
        options:
          - mp4
          - mp3
        default: "mp4"
      chat_id:
        description: "🆔 شناسه چت بله"
        required: false
        type: string

  repository_dispatch:
    types:
      - youtube_download

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Install yt-dlp & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg zip nodejs
          # نصب مستقیم آخرین نسخه پایدار
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 📥 Download video/audio
        id: dl_step
        run: |
          URL="${{ github.event.client_payload.url || github.event.inputs.video_url }}"
          FORMAT="${{ github.event.client_payload.output_format || github.event.inputs.output_format }}"
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"

          mkdir -p downloads
          cd downloads

          # تعریف پارامترهای عبور از سد یوتیوب
          # استفاده از کلاینت‌های مختلف برای جلوگیری از خطای Sign-in
          EXTRACTOR_ARGS="youtube:player_client=ios,web,android"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp \
              --extractor-args "$EXTRACTOR_ARGS" \
              --user-agent "$UA" \
              -x --audio-format mp3 --audio-quality 192k \
              -o "%(title).70s.%(ext)s" \
              "$URL"
          else
            yt-dlp \
              --extractor-args "$EXTRACTOR_ARGS" \
              --user-agent "$UA" \
              -f "bestvideo[ext=mp4][height<=720]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              -o "%(title).70s.%(ext)s" \
              "$URL"
          fi

          FILE=$(ls | head -n 1)
          echo "filename=$FILE" >> $GITHUB_OUTPUT
          echo "chat_id=$CHAT_ID" >> $GITHUB_OUTPUT
          cd ..

      - name: ✂️ Split & Zip large files
        run: |
          cd downloads
          FILE=$(ls | head -n 1)
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE")
            LIMIT=$((48*1024*1024)) # بله گاهی روی ۵۰ مگابایت حساس است، ۴۸ گذاشتم که مطمئن باشد
            if [ "$SIZE" -gt "$LIMIT" ]; then
              zip -r -s 45m "part_${FILE}.zip" "$FILE"
              rm "$FILE"
            fi
          fi
          cd ..

      - name: 📤 Send to Bale
        if: success()
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: |
          CHAT_ID="${{ steps.dl_step.outputs.chat_id }}"
          if [ -z "$CHAT_ID" ]; then exit 0; fi

          for FILE in downloads/*; do
            curl -X POST "https://tapi.bale.ai/bot${BALE_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${FILE}" \
              -F "caption=🎬 فایل شما آماده شد."
          done
