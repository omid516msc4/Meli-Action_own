name: دانلودر هوشمند یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "لینک یوتیوب"
        required: true
        type: string
      output_format:
        description: "فرمت خروجی"
        required: true
        type: choice
        options:
          - mp4
          - mp3
        default: "mp4"
      chat_id:
        description: "شناسه چت بله"
        required: false
        type: string

  repository_dispatch:
    types:
      - youtube_download

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install yt-dlp & FFmpeg
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg zip

      - name: 📥 Download with yt-dlp
        id: dl_step
        run: |
          URL="${{ github.event.client_payload.url || github.event.inputs.video_url }}"
          FORMAT="${{ github.event.client_payload.output_format || github.event.inputs.output_format }}"
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          
          mkdir -p downloads
          
          # تنظیمات دانلود بر اساس فرمت
          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp -x --audio-format mp3 --audio-quality 192k -o "downloads/%(title).50s.%(ext)s" "$URL"
          else
            yt-dlp -f "bestvideo[ext=mp4][height<=720]+bestaudio[ext=m4a]/best[ext=mp4]/best" -o "downloads/%(title).50s.%(ext)s" "$URL"
          fi
          
          # استخراج نام فایل و ذخیره chat_id
          FILENAME=$(ls downloads | head -n 1)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "chat_id=$CHAT_ID" >> $GITHUB_OUTPUT

      - name: ✂️ Split & Zip (If larger than 50MB)
        run: |
          cd downloads
          FILE=$(ls)
          SIZE=$(stat -c%s "$FILE")
          # بله گاهی روی فایل‌های بالای ۵۰ مگ حساس است، پارت‌ها را ۹۰ مگ می‌گیریم
          if [ $SIZE -gt 94371840 ]; then
            zip -s 90m "split_${FILE}.zip" "$FILE"
            rm "$FILE"
          fi
          cd ..

      - name: 📤 Send to Bale
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: |
          CHAT_ID="${{ steps.dl_step.outputs.chat_id }}"
          if [ -z "$CHAT_ID" ]; then echo "No Chat ID provided, skipping send."; exit 0; fi
          
          for f in downloads/*; do
            echo "Uploading $f..."
            curl -X POST "https://tapi.bale.ai/bot${BALE_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@$f"
          done
